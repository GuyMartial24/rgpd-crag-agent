# =====================================================================
# Ajustements pour le VPS de production
#
# Ce fichier complète docker-compose.yml : Docker Compose fusionne les
# deux fichiers, celui-ci ayant la priorité. Utilisation :
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# ou, plus simplement, avec la ligne suivante dans un fichier .env
# placé dans le dossier du projet sur le VPS :
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.vps.yml
#
# Différences avec le développement local :
# - le serveur fait aussi tourner d'autres applications qui utilisent
#   l'Ollama installé directement sur la machine. Le projet garde son
#   propre Ollama dans Docker, avec une priorité processeur maximale :
#     * quand l'assistant calcule une réponse, il obtient presque tout
#       le processeur et les autres applications patientent ;
#     * dès qu'il a fini, il ne consomme plus rien et les autres
#       applications récupèrent tout le processeur ;
# - modèles utilisés : qwen2.5:3b (léger, rapide et bon en français) et
#   bge-m3 pour les embeddings (multilingue) ;
# - délai d'attente plus long : le serveur n'a pas de carte graphique.
#
# Les modèles restent modifiables sans toucher à ce fichier, avec
# LLM_MODEL et EMBEDDING_MODEL dans le fichier .env du VPS.
# ATTENTION : changer EMBEDDING_MODEL impose de reconstruire la base :
#   docker compose run --rm ingest python -m src.ingest --reset
# =====================================================================

services:

  ollama:
    # « !reset » efface les ports définis dans docker-compose.yml : le
    # port 11434 de la machine est déjà pris par l'Ollama du serveur.
    # Les autres conteneurs du projet joignent cet Ollama par le réseau
    # interne de Docker (http://ollama:11434), sans port publié.
    ports: !reset []
    # Priorité processeur : 262144 est la valeur maximale (1024 par
    # défaut). Elle ne compte que lorsque plusieurs programmes veulent
    # le processeur en même temps : elle ne réserve rien à l'avance.
    cpu_shares: 262144
    environment:
      # Une seule question traitée à la fois : chaque question
      # supplémentaire en parallèle demanderait plus de RAM.
      OLLAMA_NUM_PARALLEL: "1"

  ollama-pull:
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}

  ingest:
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      # Temps maximum (en secondes) accordé à chaque appel à Ollama.
      REQUEST_TIMEOUT: "300"

  api:
    environment:
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      REQUEST_TIMEOUT: "300"
