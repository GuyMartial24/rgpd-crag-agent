# =====================================================================
# Configuration du serveur web nginx
#
# nginx a deux rôles :
#   1. servir les fichiers de l'interface (index.html, page.css, widget.js)
#   2. transmettre les appels /api/... au backend FastAPI (« proxy »)
# =====================================================================

# ----- Limites de protection de l'API -----
# Le serveur n'a pas de carte graphique et traite une seule question à
# la fois : sans limite, quelques visiteurs (ou un robot) suffiraient à
# le bloquer pour tout le monde.
# Les limites sont globales (communes à tous les visiteurs) : derrière
# le reverse proxy de production, toutes les requêtes arrivent avec la
# même adresse IP. La clé « $server_name » vaut toujours « _ » (voir
# server_name plus bas) : tous les visiteurs partagent donc le même
# compteur.
#   - questions : 6 par minute au maximum ;
#   - en_cours  : 4 questions en cours de traitement au maximum.
limit_req_zone $server_name zone=questions:1m rate=6r/m;
limit_conn_zone $server_name zone=en_cours:1m;

server {
    listen 80;
    server_name _;

    # Dossier contenant les fichiers de l'interface.
    root /usr/share/nginx/html;
    index index.html;

    # 1. Fichiers statiques de l'interface.
    location / {
        try_files $uri $uri/ /index.html;
        # « no-cache » : le navigateur peut garder les fichiers, mais il
        # demande à chaque visite s'ils ont changé (réponse 304 très
        # légère sinon). Après un déploiement, les visiteurs reçoivent
        # donc tout de suite le nouveau widget.js.
        add_header Cache-Control "no-cache";
    }

    # 2. Proxy vers l'API : /api/ask/stream devient
    #    http://api:8000/ask/stream
    #    (« api » est le nom du service dans docker-compose.yml ;
    #    le « / » final de proxy_pass retire le préfixe /api).
    location /api/ {
        # Limites définies en haut du fichier. « burst=6 nodelay » :
        # jusqu'à 6 questions d'affilée sont acceptées tout de suite,
        # ensuite une nouvelle place se libère toutes les 10 secondes.
        # Au-delà, nginx répond 429 (« trop de requêtes »).
        limit_req zone=questions burst=6 nodelay;
        limit_conn en_cours 4;
        limit_req_status 429;
        limit_conn_status 429;

        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Sur processeur, le LLM peut mettre plusieurs minutes à
        # répondre (surtout avec un gros modèle et plusieurs appels
        # par question) : on porte le délai d'attente
        # à 10 minutes (60 s par défaut).
        proxy_read_timeout 600s;

        # Streaming (/api/ask/stream) : chaque morceau de la réponse est
        # transmis au navigateur dès qu'il arrive, au lieu d'attendre la
        # fin. HTTP/1.1 est nécessaire pour un envoi en plusieurs
        # morceaux (« chunked »).
        proxy_http_version 1.1;
        proxy_buffering off;
    }
}
