# =====================================================================
# Configuration du serveur web nginx
#
# nginx a deux rôles :
#   1. servir les fichiers de l'interface (index.html, style.css, app.js)
#   2. transmettre les appels /api/... au backend FastAPI (« proxy »)
# =====================================================================

server {
    listen 80;
    server_name _;

    # Dossier contenant les fichiers de l'interface.
    root /usr/share/nginx/html;
    index index.html;

    # 1. Fichiers statiques de l'interface.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy vers l'API : /api/ask devient http://api:8000/ask
    #    (« api » est le nom du service dans docker-compose.yml ;
    #    le « / » final de proxy_pass retire le préfixe /api).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Sur processeur, le LLM peut mettre plusieurs minutes à
        # répondre : on augmente le délai d'attente (60 s par défaut).
        proxy_read_timeout 300s;
    }
}
